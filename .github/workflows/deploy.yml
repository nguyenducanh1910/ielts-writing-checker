name: Deploy front end to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # only to start a fresh run when GitHub Pages stays stuck (job "retry")

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      # GitHub Pages sometimes leaves a deployment queued until it times out ("Deployment failed,
      # try again later"). Give up after 5 minutes and try once more in the same run.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 300000
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

  # Still stuck: a brand-new run is what clears it, so start one (once; a run started this way
  # is a workflow_dispatch and never retries again).
  retry:
    needs: deploy
    if: failure() && needs.deploy.result == 'failure' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
          echo "::warning::GitHub Pages was stuck; started a new deploy run."
